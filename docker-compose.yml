version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-rustic_bakes}
    ports:
      - "127.0.0.1:8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://cafedailycravings.in}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]

  # Optional reverse proxy for HTTPS + backend routing on same domain
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, backend]
    profiles: ["prod"]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
